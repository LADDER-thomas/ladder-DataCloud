version: 0.2

phases:
  install:
    commands:
      - set -euxo pipefail
      - echo "START INSTALL PHASE"
      - mkdir -p tableau-achievement
      - echo "Fetching .env from Parameter Store /performance_management/${build_env}"
      - aws ssm get-parameter --name "/performance_management/${build_env}" --with-decryption --query "Parameter.Value" --output text > tableau-achievement/.env

  pre_build:
    commands:
      - echo "START PRE BUILD PHASE"
      - echo "Login to ECR"
      - aws ecr get-login-password --region "${region}" | docker login --username AWS --password-stdin "${account_id}.dkr.ecr.${region}.amazonaws.com"
      - echo "region=${region} account_id=${account_id} build_env=${build_env}"
      - echo "SOURCE=${CODEBUILD_SRC_DIR}"
      - echo "commit=${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"

  build:
    commands:
      - echo "START BUILD PHASE"
      - echo "BUILD PERFORMANCE MANAGEMENT CONTAINER"
      - docker build --progress=plain -t "performance-management:${IMAGE_TAG}" -f tableau-achievement/Dockerfile tableau-achievement
      - docker image tag "performance-management:${IMAGE_TAG}" "${account_id}.dkr.ecr.${region}.amazonaws.com/performance_management/${build_env}:latest"
      - docker image tag "performance-management:${IMAGE_TAG}" "${account_id}.dkr.ecr.${region}.amazonaws.com/performance_management/${build_env}:${IMAGE_TAG}"

  post_build:
    commands:
      - echo "PUSH IMAGES"
      - docker push "${account_id}.dkr.ecr.${region}.amazonaws.com/performance_management/${build_env}:latest"
      - docker push "${account_id}.dkr.ecr.${region}.amazonaws.com/performance_management/${build_env}:${IMAGE_TAG}"
      - echo "Build completed successfully"
